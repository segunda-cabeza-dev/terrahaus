# Docker Compose para DESARROLLO LOCAL (web + api + db)
# Uso:
#   cp .env.example .env
#   docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: terrahaus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrahaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrahaus_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terrahaus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrahaus} -d ${POSTGRES_DB:-terrahaus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: terrahaus-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-terrahaus}:${POSTGRES_PASSWORD:-terrahaus_secret}@db:5432/${POSTGRES_DB:-terrahaus}?schema=public
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/apps/api
    command: ["npm", "run", "db:migrate"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: terrahaus-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-terrahaus}:${POSTGRES_PASSWORD:-terrahaus_secret}@db:5432/${POSTGRES_DB:-terrahaus}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CORS_ORIGIN: http://localhost:5173
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: terrahaus-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_ASSETS_URL: ${VITE_ASSETS_URL:-}
      VITE_GTM_ID: ${VITE_GTM_ID:-}
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared

volumes:
  postgres-data:
