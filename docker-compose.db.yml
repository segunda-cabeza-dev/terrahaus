# Docker Compose SOLO DB para desarrollo local.
# Uso:
#   docker compose -f docker-compose.db.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: terrahaus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrahaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrahaus_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terrahaus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrahaus} -d ${POSTGRES_DB:-terrahaus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

