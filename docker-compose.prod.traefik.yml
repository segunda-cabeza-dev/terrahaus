# Override opcional para Traefik (producción).
#
# Uso:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.traefik.yml up -d

services:
  web:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.terrahaus.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.terrahaus.entrypoints=websecure"
      - "traefik.http.routers.terrahaus.tls.certresolver=letsencrypt"
      - "traefik.http.services.terrahaus.loadbalancer.server.port=80"

  api:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.terrahaus-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.terrahaus-api.entrypoints=websecure"
      - "traefik.http.routers.terrahaus-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.terrahaus-api.loadbalancer.server.port=3000"

  db:
    networks:
      - traefik-public

  migrate:
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
