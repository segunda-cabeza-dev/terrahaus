# Override: env vars para webhook de Perfex / leads.
#
# Uso:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.traefik.yml -f docker-compose.prod.leads.yml up -d

services:
  api:
    environment:
      LEADS_WEBHOOK_URL: ${LEADS_WEBHOOK_URL}
      LEADS_WEBHOOK_AUTHTOKEN: ${LEADS_WEBHOOK_AUTHTOKEN}
      LEADS_WEBHOOK_TIMEOUT_MS: ${LEADS_WEBHOOK_TIMEOUT_MS}
      LEADS_WEBHOOK_TAGS: ${LEADS_WEBHOOK_TAGS}
      LEADS_WEBHOOK_LOG_SUCCESS: ${LEADS_WEBHOOK_LOG_SUCCESS}
      LEADS_WEBHOOK_SOURCE_ID: ${LEADS_WEBHOOK_SOURCE_ID}
      LEADS_WEBHOOK_STATUS_ID: ${LEADS_WEBHOOK_STATUS_ID}
      LEADS_WEBHOOK_ASSIGNED_ID: ${LEADS_WEBHOOK_ASSIGNED_ID}
      LEADS_WEBHOOK_STATUS: ${LEADS_WEBHOOK_STATUS}
      LEADS_WEBHOOK_ASSIGNED: ${LEADS_WEBHOOK_ASSIGNED}

