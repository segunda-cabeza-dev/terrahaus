# Docker Compose para PRODUCCIÓN (web + api + db + migrate one-shot)
#
# Recomendado (Portainer/servidor):
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Opcional Traefik: ver docker-compose.prod.traefik.yml

services:
  db:
    image: postgres:16-alpine
    container_name: terrahaus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE}:${IMAGE_TAG}
    container_name: terrahaus-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/apps/api
    command: ["npm", "run", "db:migrate"]

  api:
    image: ${API_IMAGE}:${IMAGE_TAG}
    container_name: terrahaus-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  web:
    image: ${WEB_IMAGE}:${IMAGE_TAG}
    container_name: terrahaus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres-data:

