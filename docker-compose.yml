# Docker Compose para DESARROLLO LOCAL
# Solo PostgreSQL y API - El frontend se ejecuta con Vite
# Uso: docker compose up -d

services:
  # ===================
  # POSTGRES - Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: terrahaus-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=terrahaus
      - POSTGRES_PASSWORD=terrahaus_secret
      - POSTGRES_DB=terrahaus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrahaus -d terrahaus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================
  # API - Fastify Backend
  # ===================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: terrahaus-api
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=terrahaus
      - DB_PASSWORD=terrahaus_secret
      - DB_NAME=terrahaus
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5174
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
